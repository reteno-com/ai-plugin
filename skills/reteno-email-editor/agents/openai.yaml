interface:
  display_name: "Reteno Email Editor"
  short_description: "Read Reteno email export manifests, then clone or update through MCP with allowed text edits, translations, or existing-image replacement."
  default_prompt: >-
    Use the Reteno MCP tool get_email_message_export(message_id) to read a message by ID,
    download every exported html and css artifact with curl -sL via Bash (not WebFetch),
    preserve the original builder HTML and css field, and never hand-edit exported Reteno
    HTML artifacts under output/reteno/ with generic file-edit tools. For visible text,
    button copy, and explicit hidden preheader replacements, run python3
    skills/reteno-email-editor/scripts/edit_reteno_email_html.py --html <path>
    --replacements <json-path>. Edit only text inside existing esd-block-text and
    esd-block-button blocks, and use block_type hidden_preheader only for text inside the
    existing esd-hidden-preheader span when doing full email translation/localization or
    explicit preheader updates. Treat visible link text as translatable text while preserving
    href URLs unless URL localization is requested. Translate product and tool labels unless
    the user explicitly asks to preserve English brand labels. For image replacement, create a
    fresh output/reteno/runs/email_<ID>_<UTC_TIMESTAMP>/ directory and keep the export
    artifacts, downloaded original image, and replacement image in that run directory; never
    reuse stale artifacts from previous runs. Run python3
    skills/reteno-email-editor/scripts/edit_reteno_email_images.py --html <path> inventory,
    and if the target image is ambiguous ask instead of guessing. Use a local replacement
    image file (JPG, PNG, GIF, or WEBP, max 3 MB) that preserves the original layout,
    composition, palette, proportions, and transparency unless the user asks for a new
    composition. Call Reteno MCP prepare_image_upload(name=<asset-filename>), stage the file
    to the returned signed upload URL with curl PUT and the correct image content type, then
    call upload_image(uploadSessionId=<same-ID>, name=<same-asset-filename>). The name must be
    identical in prepare_image_upload and upload_image. If upload_image fails with a 5xx
    Reteno API error, wait 10 seconds and retry once with the same session and name; if that
    retry fails, stop and report the error. Then run python3
    skills/reteno-email-editor/scripts/edit_reteno_email_images.py --html <path> replace
    --index <one-based-index> --expected-src <old-src> --new-src <reteno-asset-url>. Replace
    only one existing image src, and change alt only when explicitly requested. Treat subject
    and metadata preheader as metadata updates outside the HTML edit path. Preserve
    per-translation CSS artifacts for multilingual messages, preserve emoji and other Unicode
    characters exactly across translations, run python3
    skills/reteno-email-editor/scripts/verify_reteno_email_translation.py on localized
    artifacts before upload/finalize for full translation/localization, confirm visible link
    text and hidden preheader text are localized, and stop on helper validation failures. If
    update_email_message_translation reports malformed JSON, treat that as an upstream Reteno
    MCP defect, verify with get_email_message_export(message_id), and do not retry the same
    translation write when the export confirms the requested state. Then write back through
    prepare_email_message_upload and create_email_message or update_email_message using
    uploadSessionId, uploading HTML as text/html and CSS as text/css with curl PUT to the
    signed upload URLs, never through /mcp or synthetic path query params.
